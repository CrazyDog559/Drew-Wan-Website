<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Phlebotomy Practice App: quiz card and collection tubes illustration">
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0C1626"/>
      <stop offset="100%" stop-color="#102338"/>
    </linearGradient>
    <radialGradient id="phGlow" cx="0.24" cy="0.28" r="0.62">
      <stop offset="0%" stop-color="#2490FE" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2490FE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="phGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5CA9FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="phAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CA9FF"/>
      <stop offset="100%" stop-color="#2490FE"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#phBg)"/>
  <rect width="1280" height="720" fill="url(#phGrid)"/>
  <rect width="1280" height="720" fill="url(#phGlow)"/>

  <!-- Quiz card -->
  <g>
    <rect x="700" y="176" width="330" height="256" rx="18" fill="#111A28" stroke="#5CA9FF" stroke-opacity="0.4" stroke-width="2.5"/>
    <text x="730" y="220" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" letter-spacing="3" fill="#7A8AA2">QUESTION 12 / 40</text>
    <rect x="730" y="238" width="230" height="9" rx="4.5" fill="#5CA9FF" fill-opacity="0.35"/>
    <rect x="730" y="262" width="180" height="9" rx="4.5" fill="#5CA9FF" fill-opacity="0.18"/>
    <!-- answer rows -->
    <g stroke="#5CA9FF" stroke-opacity="0.35" stroke-width="2" fill="none">
      <rect x="730" y="296" width="270" height="38" rx="9"/>
      <rect x="730" y="344" width="270" height="38" rx="9"/>
      <rect x="730" y="392" width="270" height="14" rx="7" stroke-opacity="0.15"/>
    </g>
    <!-- correct answer -->
    <rect x="730" y="296" width="270" height="38" rx="9" fill="#2490FE" fill-opacity="0.18" stroke="#5CA9FF" stroke-width="2.5"/>
    <path d="M752 315l9 9 17-18" fill="none" stroke="#5CA9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="792" y="309" width="120" height="8" rx="4" fill="#EDF3FC" fill-opacity="0.6"/>
    <rect x="752" y="359" width="140" height="8" rx="4" fill="#EDF3FC" fill-opacity="0.22"/>
  </g>

  <!-- Order-of-draw tubes: colours are the standard evacuated-tube stopper colours -->
  <g transform="translate(706 476)">
    <text x="0" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" letter-spacing="3" fill="#7A8AA2">ORDER OF DRAW</text>
    <g stroke="#5CA9FF" stroke-opacity="0.45" stroke-width="2.5" fill="none">
      <rect x="0" y="24" width="44" height="132" rx="20"/>
      <rect x="62" y="24" width="44" height="132" rx="20"/>
      <rect x="124" y="24" width="44" height="132" rx="20"/>
      <rect x="186" y="24" width="44" height="132" rx="20"/>
      <rect x="248" y="24" width="44" height="132" rx="20"/>
    </g>
    <g>
      <rect x="2" y="26" width="40" height="30" rx="15" fill="#67E8F9"/>
      <rect x="64" y="26" width="40" height="30" rx="15" fill="#93C5FD"/>
      <rect x="126" y="26" width="40" height="30" rx="15" fill="#F87171"/>
      <rect x="188" y="26" width="40" height="30" rx="15" fill="#34D399"/>
      <rect x="250" y="26" width="40" height="30" rx="15" fill="#C084FC"/>
    </g>
    <g fill="#5CA9FF" fill-opacity="0.2">
      <rect x="4" y="96" width="36" height="58" rx="16"/>
      <rect x="66" y="106" width="36" height="48" rx="16"/>
      <rect x="128" y="88" width="36" height="66" rx="16"/>
      <rect x="190" y="112" width="36" height="42" rx="16"/>
      <rect x="252" y="100" width="36" height="54" rx="16"/>
    </g>
  </g>

  <!-- Type -->
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="96" y="248" width="6" height="66" rx="3" fill="url(#phAccent)"/>
    <text x="126" y="224" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" letter-spacing="5.5" fill="#5CA9FF">NHA CPT EXAM PREP</text>
    <text x="122" y="306" font-size="84" font-weight="700" fill="#EDF3FC">Phlebotomy</text>
    <text x="122" y="374" font-size="46" font-weight="600" fill="#5CA9FF">Practice App</text>
    <text x="126" y="428" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" letter-spacing="2" fill="#7A8AA2">React · Supabase · Stripe · Vercel</text>
  </g>

  <g stroke="#5CA9FF" stroke-opacity="0.35" stroke-width="2.5" fill="none">
    <path d="M56 96V56h40M1184 56h40v40M1224 624v40h-40M96 664H56v-40"/>
  </g>
</svg>
