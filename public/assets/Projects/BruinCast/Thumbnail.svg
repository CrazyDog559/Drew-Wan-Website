<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="BruinCast: classroom capture and monitoring schematic">
  <defs>
    <linearGradient id="bcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0C1626"/>
      <stop offset="100%" stop-color="#102338"/>
    </linearGradient>
    <radialGradient id="bcGlow" cx="0.24" cy="0.28" r="0.62">
      <stop offset="0%" stop-color="#2490FE" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2490FE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bcGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5CA9FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="bcAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CA9FF"/>
      <stop offset="100%" stop-color="#2490FE"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bcBg)"/>
  <rect width="1280" height="720" fill="url(#bcGrid)"/>
  <rect width="1280" height="720" fill="url(#bcGlow)"/>

  <!-- Schematic: PTZ camera feeding a capture node feeding three viewers -->
  <g fill="none" stroke="#5CA9FF" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera body -->
    <rect x="760" y="212" width="150" height="94" rx="14"/>
    <path d="M910 240l58-30v84l-58-30z"/>
    <circle cx="812" cy="259" r="26"/>
    <circle cx="812" cy="259" r="11" stroke-opacity="0.9"/>
    <path d="M835 200v-24M760 200l-14-20M910 200l14-20"/>
    <!-- Signal arcs -->
    <path d="M700 259a70 70 0 0 1 0-0.4" stroke-opacity="0.3"/>
    <path d="M716 218a74 74 0 0 0 0 82" stroke-opacity="0.35"/>
    <path d="M688 198a112 112 0 0 0 0 122" stroke-opacity="0.22"/>
    <!-- Bus down to node -->
    <path d="M835 330v52H700v76" stroke-dasharray="10 9"/>
    <!-- Capture node -->
    <rect x="612" y="458" width="176" height="106" rx="14"/>
    <path d="M648 496h104M648 520h72M648 544h48" stroke-opacity="0.45"/>
    <!-- Fan-out to endpoints -->
    <path d="M788 511h72M860 511v-96h84M860 511v96h84M860 511h84" stroke-dasharray="8 8" stroke-opacity="0.5"/>
    <rect x="944" y="386" width="112" height="60" rx="10"/>
    <rect x="944" y="481" width="112" height="60" rx="10"/>
    <rect x="944" y="577" width="112" height="60" rx="10"/>
  </g>

  <g fill="#5CA9FF">
    <circle cx="700" cy="382" r="5"/>
    <circle cx="860" cy="511" r="5"/>
    <circle cx="1000" cy="416" r="4" fill-opacity="0.7"/>
    <circle cx="1000" cy="511" r="4" fill-opacity="0.7"/>
    <circle cx="1000" cy="607" r="4" fill-opacity="0.7"/>
  </g>

  <!-- Recording indicator -->
  <g>
    <circle cx="790" cy="176" r="9" fill="#F87171"/>
    <text x="812" y="183" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" letter-spacing="3" fill="#F87171">REC</text>
  </g>

  <!-- Type -->
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="96" y="228" width="6" height="66" rx="3" fill="url(#bcAccent)"/>
    <text x="126" y="204" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" letter-spacing="5.5" fill="#5CA9FF">CLASSROOM CAPTURE</text>
    <text x="122" y="286" font-size="88" font-weight="700" fill="#EDF3FC">BruinCast</text>
    <text x="126" y="336" font-size="27" fill="#9EADC3">Monitoring &amp; AV operations support</text>
    <text x="126" y="404" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" letter-spacing="2" fill="#7A8AA2">bruin-cast.vercel.app</text>
  </g>

  <!-- Corner ticks -->
  <g stroke="#5CA9FF" stroke-opacity="0.35" stroke-width="2.5" fill="none">
    <path d="M56 96V56h40M1184 56h40v40M1224 624v40h-40M96 664H56v-40"/>
  </g>
</svg>
