name: Deploy To Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Connect and compare only — upload nothing. Use this to test credentials safely.'
        type: boolean
        default: false
      log_level:
        description: 'FTP log verbosity'
        type: choice
        options:
          - standard
          - verbose
        default: standard

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Dist To Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          # GitHub now runs actions on Node 24, where "Happy Eyeballs"
          # (autoSelectFamily) is on by default and aborts each connection
          # attempt after 250 ms. Shared FTP hosts routinely take longer than
          # that to accept, which surfaces as an immediate and very misleading
          # AggregateError [ETIMEDOUT] on the control socket. Give each address
          # a realistic window instead.
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=5000
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          # Hostinger listens on 21 for both plain FTP and explicit FTPS.
          # There is no implicit-FTPS listener on 990.
          port: ${{ secrets.HOSTINGER_PORT || 21 }}
          # Set a HOSTINGER_PROTOCOL repository *variable* to 'ftps' to upgrade
          # to explicit TLS on the same port. Not a secret — it is not sensitive
          # and being able to see its value while debugging matters.
          protocol: ${{ vars.HOSTINGER_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          # Relative, matching the "File Upload Path" hPanel shows. This resolves
          # against the FTP login directory whether or not the account is
          # chrooted, unlike an absolute /public_html.
          server-dir: /
          # The action's own budget, raised from the 30s default: the first sync
          # to a fresh server uploads far more than later incremental ones.
          timeout: 60000
          dry-run: ${{ inputs.dry_run || false }}
          log-level: ${{ inputs.log_level || 'standard' }}
          dangerous-clean-slate: false

      # A green FTP upload does not prove the site actually updated: if the
      # server-dir resolves outside the web root, the action happily uploads
      # everything somewhere invisible and still reports success. Check the
      # real site instead of trusting the exit code.
      - name: Verify deployment
        if: ${{ !inputs.dry_run }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://drewwan.com' }}
        run: |
          bundle=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::Could not find the hashed bundle in dist/index.html — the build output looks wrong."
            exit 1
          fi
          echo "Looking for $SITE_URL$bundle"

          code=000
          for attempt in 1 2 3 4 5; do
            sleep 10
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -L "$SITE_URL$bundle" || echo 000)
            echo "  attempt $attempt: $code"
            [ "$code" = "200" ] && break
          done
          source_exposed=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -L "$SITE_URL/package.json" || echo 000)
          echo "  /package.json: $source_exposed"

          failed=0
          if [ "$code" != "200" ]; then
            echo "::error::$bundle is not reachable ($code). The upload did not land in the web root — check that HOSTINGER_TARGET_DIR/server-dir resolves to public_html."
            failed=1
          fi
          if [ "$source_exposed" = "200" ]; then
            echo "::error::/package.json is publicly served, so the repository source is sitting in the web root. Disable hPanel's Git auto-deploy (Advanced -> Git); it publishes unbuilt source and overwrites this deploy."
            failed=1
          fi
          [ "$failed" = "0" ] && echo "Deployment verified."
          exit $failed
